outer_loop:
  cycle: 1
  last_direction: "Test whether resetting the cumulative CFM invalid mask unlocks the tempered-source signal, which creates more episode boundaries and loses valid samples faster than the official control."
  last_reflection: "A 20% scale-0.5 source subset recovered full-noise collection from H8's 7.08% to 9.09%, but gained only 0.32 points over control and reduced final random success to 6%. H9 is refuted without a source sweep; its 93.91% final valid-CFM fraction motivates one interaction test with mask reset."

