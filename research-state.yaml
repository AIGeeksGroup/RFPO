project:
  title: "Reproducing and Improving FPO++ for Robot Control"
  question: "Can the official FPO++ benchmark results be reproduced, and can straighter conditional policy flows improve return or sampling efficiency?"
  status: active
  started: "2026-08-08"
  domain: "robot reinforcement learning and flow policies"

literature:
  key_papers:
    - id: yi2026fpo_control
      title: "Flow Policy Gradients for Robot Control"
      year: 2026
      relevance: "Target method and benchmark."
    - id: liu2022rectified_flow
      title: "Flow Straight and Fast: Learning to Generate and Transfer Data with Rectified Flow"
      year: 2022
      relevance: "Motivates reflow to straighten conditional noise-to-action trajectories."
    - id: kang2026_warmprior
      title: "WarmPrior: Straightening Flow-Matching Policies with Temporal Priors"
      year: 2026
      relevance: "Motivates training the source distribution around the previous executed action chunk."
    - id: schulman2015_gae
      title: "High-Dimensional Continuous Control Using Generalized Advantage Estimation"
      year: 2015
      relevance: "Motivates lambda=1 as a lower-bias way to propagate sparse terminal success through long Can episodes."
    - id: pan2023_dae
      title: "Direct Advantage Estimation"
      year: 2023
      relevance: "Motivates learning action effects directly; FPO++ requires a Monte Carlo centering approximation for continuous implicit actions."
    - id: wortsman2022_wise_ft
      title: "Robust Fine-Tuning of Zero-Shot Models"
      year: 2022
      relevance: "Motivates fixed weight-space interpolation between pretrained and finetuned policies to retain robustness while preserving adaptation."
    - id: yu2020_pcgrad
      title: "Gradient Surgery for Multi-Task Learning"
      year: 2020
      relevance: "Motivates coefficient-free projection when an RL gradient conflicts with a behavior-anchor gradient."
    - id: schmitt2018_kickstarting
      title: "Kickstarting Deep Reinforcement Learning"
      year: 2018
      relevance: "Motivates retaining a fixed pretrained teacher as an auxiliary behavior objective during RL."
    - id: zhao2023_act
      title: "Learning Fine-Grained Bimanual Manipulation with Low-Cost Hardware"
      year: 2023
      relevance: "Motivates temporally ensembling overlapping action-chunk predictions."
    - id: xu2026_bcp
      title: "Continue or Replan? Bernoulli-Continuation Policy Learning for Adaptive Horizon Execution"
      year: 2026
      relevance: "Motivates a phase-shift prerequisite before learning an exact-likelihood continuation head."
    - id: lei2026_rldt
      title: "Reinforcement Learning for Flow-Matching Policies with Density Transport"
      year: 2026
      relevance: "Motivates value-aware SVGD transport, but requires a reliable double-Q critic and has no public code as of 2026-08-09."
    - id: pinto2017_asymmetric_actor_critic
      title: "Asymmetric Actor Critic for Image-Based Robot Learning"
      year: 2017
      relevance: "Motivates using simulator state only in the training critic while preserving visual policy inputs."
    - id: ng1999_policy_invariance
      title: "Policy Invariance Under Reward Transformations: Theory and Application to Reward Shaping"
      year: 1999
      relevance: "Motivates potential-based Square stage shaping that changes credit assignment without changing the sparse-success objective."
    - id: wang2020_truly_ppo
      title: "Truly Proximal Policy Optimization"
      year: 2020
      relevance: "Motivates rollback gradients for improving CFM ratios that cross the FPO++ clipping boundary."
    - id: wang2026_refpo
      title: "ReFPO: Reflow Regularization for Flow Matching Policy Gradients"
      year: 2026
      relevance: "Specifies an unweighted current-CFM regularizer for reducing fixed-batch FPO proxy-ratio volatility without additional flow evaluations."
    - id: yang2026_vine
      title: "VINE: Taming Generative Control Policies for Reinforcement Learning"
      year: 2026
      relevance: "Reconstructs interpolation states for stable action-value-gradient BPTT, but requires twin-Q and replay infrastructure absent from FPO++."
    - id: hamid2025_polychromic
      title: "Polychromic Objectives for Reinforcement Learning"
      year: 2025
      relevance: "Uses multiple continuations from common intermediate states to form Monte Carlo set advantages without relying on a learned value at vine states."
    - id: garg2021_heavy_tailed_ppo
      title: "On Proximal Policy Optimization's Heavy-tailed Gradients"
      year: 2021
      relevance: "Motivates geometric median-of-means aggregation of complete PPO gradient vectors."
    - id: izmailov2018_swa
      title: "Averaging Weights Leads to Wider Optima and Better Generalization"
      year: 2018
      relevance: "Motivates uniform averaging of policy checkpoints along one online optimization trajectory."
    - id: jia2025_antithetic_noise
      title: "Antithetic Noise in Diffusion Models"
      year: 2025
      relevance: "Direct precedent for z/-z negative endpoint correlation in diffusion and normalizing flows; H66 novelty must be control-specific rather than the pairing operation itself."
    - id: andrychowicz2020_onpolicy
      title: "What Matters In On-Policy Reinforcement Learning? A Large-Scale Empirical Study"
      year: 2020
      relevance: "Establishes that minibatch and normalization implementation choices materially affect on-policy continuous control."
    - id: oh2018_self_imitation
      title: "Self-Imitation Learning"
      year: 2018
      relevance: "Motivates reward-conditioned reuse, but H15's success-gradient bias rejects it as the next FPO++ intervention."
    - id: shao2024_deepseekmath
      title: "DeepSeekMath: Pushing the Limits of Mathematical Reasoning in Open Language Models"
      year: 2024
      relevance: "Introduces group-relative policy optimization without a learned value baseline."
    - id: xu2026_bcp
      title: "Continue or Replan? Bernoulli-Continuation Policy Learning for Adaptive Horizon Execution"
      year: 2026
      relevance: "Provides a direct robot chunk-policy precedent for trajectory-level group-relative optimization."
  open_problems:
    - "FPO++ uses many Euler steps; it is unknown whether conditional reflow improves control return or only sampling efficiency."
    - "The relation between flow curvature, CFM ratio variance, and policy-update stability is not established."
  evidence_gaps:
    - "Reflow has not yet been tested in online flow-policy optimization on these benchmarks."

hypotheses:
  - id: H0
    statement: "The official Go2 and Can baselines reproduce the authors' learning trends and final metrics within a predeclared tolerance."
    status: supported
    motivation: "Algorithm improvements are uninterpretable until the released baseline is validated."
    parent: null
    priority: high
  - id: H1
    statement: "Conditional reflow reduces policy trajectory curvature and preserves return when the Euler sampling steps are reduced."
    status: supported
    motivation: "Rectified Flow predicts straighter paths and lower numerical integration error after reflow."
    parent: null
    priority: high
  - id: H1b
    statement: "One-stage conditional reflow improves official 10-step Can success by at least five percentage points."
    status: refuted
    motivation: "Screening gains must survive an official-scale evaluation before being treated as a benchmark improvement."
    parent: H1
    priority: low
  - id: H2
    statement: "Using reflow regularization during FPO++ training reduces CFM-ratio dispersion and improves training stability or final return."
    status: refuted
    motivation: "Straighter conditional flows may reduce Monte Carlo gradient disagreement, a documented FPO++ failure mode."
    parent: H1
    priority: medium
  - id: H3
    statement: "A recent-action WarmPrior improves random-sampling success and FPO++ fine-tuning efficiency on chunked manipulation tasks."
    status: refuted
    motivation: "A temporally grounded source can straighten conditional flows while centering exploration near plausible actions."
    parent: null
    priority: high
  - id: H3a
    statement: "A previous-action source can improve the released Gaussian-trained checkpoint without behavior-cloning adaptation."
    status: refuted
    motivation: "Tests whether the inexpensive inference-only intervention is viable before retraining."
    parent: H3
    priority: low
  - id: H4
    statement: "Mixing dataset and reflow endpoints restores action grounding while retaining enough straightening to improve Can success."
    status: refuted
    motivation: "Pure reflow improved geometry but not official-scale reward, suggesting endpoint grounding rather than curvature is now the bottleneck."
    parent: H1
    priority: high
  - id: H5
    statement: "Using 16 instead of 8 CFM samples per action reduces early Can FPO++ gradient noise and improves reward learning."
    status: refuted
    motivation: "The paper identifies sparse random-sampling successes as a source of high gradient variance, and lists 16 samples as an in-scope setting."
    parent: H2
    priority: high
  - id: H6
    statement: "Resetting the reused CFM invalid-step mask every rollout iteration prevents cumulative sample loss and improves early Can FPO++ reward learning."
    status: refuted
    motivation: "The released loop marks post-boundary actions invalid in a persistent buffer but never clears that buffer between independent rollouts."
    parent: H2
    priority: high
  - id: H7
    statement: "Using GAE lambda 1.0 instead of 0.99 propagates sparse terminal success farther and improves early Can FPO++ reward learning."
    status: refuted
    motivation: "At the 300-step Can horizon, the official gamma-lambda product almost eliminates terminal credit for early actions."
    parent: H2
    priority: high
  - id: H8
    statement: "A minority of zero-source rollout environments supplies successful trajectories that improve the shared Gaussian-source Can policy."
    status: refuted
    motivation: "Can's zero-source policy succeeds far more often than its random-source policy, so mixed collection can add reward information without discarding Gaussian exploration."
    parent: null
    priority: high
  - id: H9
    statement: "A minority tempered-Gaussian rollout subset transfers successful near-modal Can trajectories into the official full-noise policy."
    status: refuted
    motivation: "Unlike a delta-zero source, N(0, 0.5^2 I) continuously overlaps the official N(0, I) source while concentrating samples near the successful deterministic mode."
    parent: H8
    priority: high
  - id: H10
    statement: "Resetting the validity mask unlocks tempered-source Can learning by preserving samples lost after its more frequent successful episode boundaries."
    status: refuted
    motivation: "The tempered mixture ended with only 93.91% valid CFM actions, so the bookkeeping defect is materially larger than in the official control."
    parent: H9
    priority: high
  - id: H11
    statement: "ESS-normalized exponential advantage weights improve early standard-Gaussian Can learning when used inside the FPO++ per-sample clipped-ratio objective."
    status: refuted
    motivation: "H8-H10 show that reward supply is abundant but guided-source transfer is invalid or ineffective; mirror weights prioritize the rare successful on-policy samples without source mismatch."
    parent: H2
    priority: high
  - id: H12
    statement: "The Can step-6000 base checkpoint provides substantially denser Gaussian-source successes than the official step-1000 initialization."
    status: supported
    motivation: "Appendix D.4 reports 64.06% random success for a higher-quality Can base policy, which could provide a higher-signal small-budget method-screening regime."
    parent: H0
    priority: high
  - id: H13
    statement: "Using fixed rollout-level advantage moments reduces update-weight drift and improves early FPO++ Can success relative to per-minibatch normalization."
    status: refuted
    motivation: "Terminal binary rewards make minibatch composition highly variable; recomputing normalization after every reshuffle changes trajectory weights across epochs without adding information."
    parent: H2
    priority: high
  - id: H14
    statement: "Joint antithetic time/noise pairs reduce MC8 CFM policy-gradient estimator variance at unchanged compute."
    status: refuted
    motivation: "FPO++ ratios depend on Monte Carlo CFM samples; symmetric pairing can improve estimator information efficiency without changing the objective or exploration distribution."
    parent: H2
    priority: high
  - id: H15
    statement: "Reusing recent successful standard-Gaussian on-policy trajectories can increase useful FPO++ update information without unacceptable stale-policy ratio error."
    status: refuted
    motivation: "H8-H11 show that reward supply and reweighting alone are insufficient; replay may reuse rare valid successes, but only if short-horizon policy staleness is measurable and controlled."
    parent: H2
    priority: high
  - id: H16
    statement: "FPO++ overfits rollout-stored MC8 CFM variables across update epochs, leaving independent held-out MC8 ratios closer to the behavior policy and less clipped."
    status: refuted
    motivation: "H15 found severe one-update clipping on stored successful chunks; fresh behavior-anchored CFM draws per epoch could improve estimator generalization without changing rewards or exploration."
    parent: H2
    priority: high
  - id: H17
    statement: "A fixed-budget 12/4 CFM sample allocation to high/low absolute-advantage chunks estimates the signed FPO++ policy gradient more accurately than uniform MC8."
    status: refuted
    motivation: "Uniform MC8 spends equal estimator compute on chunks with very different policy-gradient coefficients; reallocating rather than increasing samples may improve information efficiency without changing total forward cost."
    parent: H2
    priority: high
  - id: H18
    statement: "Rolling back the first actor epoch that drives independent positive CFM ratios below 80% active preserves useful surrogate improvement while preventing FPO++ gradient rotation."
    status: refuted
    motivation: "H16 found that the official ten-epoch update leaves only 54.7% of held-out positive ratios active and rotates the held-out gradient to cosine 0.743; PPO clipping does not itself stop repeated-epoch drift."
    parent: H2
    priority: high
  - id: H19
    statement: "A bounded critic trained on uncensored discounted binary-success returns improves next-rollout value accuracy and aligns the first FPO++ actor gradient with Monte Carlo outcomes."
    status: refuted
    motivation: "H18 shows that gradient rotation is already severe after one actor epoch, so later trust-region controls cannot fix the first-step learning signal; Can rewards are binary and bounded but the official critic uses an unbounded scalar MSE target."
    parent: H2
    priority: high
  - id: H20
    statement: "Restoring a nonzero critic learning rate during the released critic-only warmup improves next-rollout value accuracy and first-step actor-gradient alignment."
    status: invalidated
    motivation: "The released scheduler sets critic LR to zero for all ten iteration-1 optimizer epochs, so the first actor update uses a random, untrained critic despite the explicit critic-only warmup."
    parent: H2
    priority: high
  - id: H21
    statement: "A chunk-level direct-advantage head with Monte Carlo flow-policy centering improves fresh-rollout advantage ranking and first-step FPO++ gradient alignment."
    status: refuted
    motivation: "H19 lowered value MSE but degraded rank and one gradient batch; DAE targets action effects directly instead of relying on absolute value calibration."
    parent: H2
    priority: high
  - id: H22
    statement: "Centered empirical-rank weights preserve GAE outcome ordering while improving first-step FPO++ gradient alignment."
    status: refuted
    motivation: "H21 found that official GAE already has 0.817 outcome Spearman correlation, while learned replacement advantages reverse ordering; a rank transform retains the useful signal and removes unreliable magnitude information."
    parent: H2
    priority: high
  - id: H23
    statement: "A fourfold lower actor learning rate preserves the initially aligned GAE gradient through ten FPO++ optimizer epochs."
    status: refuted
    motivation: "H21-H22 retain official GAE, while H18 shows severe parameter-induced gradient rotation after optimization; reducing step size targets the remaining failure mechanism directly."
    parent: H2
    priority: high
  - id: H24
    statement: "Accumulating all eight minibatch gradients before each actor optimizer step preserves the initially aligned GAE gradient through ten FPO++ epochs."
    status: refuted
    motivation: "H23 reduced surrogate movement without preserving gradient direction, suggesting that sequential Adam steps on shuffled minibatches, rather than global learning rate alone, drive the update path away from the pre-update gradient."
    parent: H2
    priority: high
  - id: H25
    statement: "A fixed midpoint interpolation between the step-6000 BC actor and its FPO++-finetuned actor improves deterministic Can stability while retaining stochastic-source gains."
    status: refuted
    motivation: "The existing five-update FPO++ run improves random-source success but degrades zero-source success; WiSE-FT-style interpolation can recover pretrained robustness without another unstable policy-gradient update."
    parent: null
    priority: high
  - id: H26
    statement: "Averaging action chunks generated from one antithetic Gaussian source pair improves released step-1000 Can success over official zero-source inference."
    status: refuted
    motivation: "Symmetric source evaluation can cancel odd endpoint variation while retaining even nonlinear corrections, potentially reducing inference variance without changing training or checkpoint weights."
    parent: null
    priority: high
  - id: H27
    statement: "Executing four rather than eight actions from each predicted Can chunk improves success by incorporating visual feedback more frequently."
    status: refuted
    motivation: "The released policy predicts 16 actions but executes eight open loop; shorter receding-horizon execution can correct grasp and placement errors before they accumulate without changing weights or source sampling."
    parent: null
    priority: high
  - id: H28
    statement: "Conflict projection against a frozen BC velocity-field gradient preserves initial Can behavior while retaining most useful FPO++ surrogate improvement."
    status: refuted
    motivation: "H18 and H23 show destructive gradient rotation that a smaller step does not fix; H25 shows post-hoc interpolation cannot recover an absent reward gain."
    parent: H18
    priority: high
  - id: H29
    statement: "Conflict projection against the frozen zero-source action endpoint preserves deterministic Can behavior while retaining most useful FPO++ surrogate improvement."
    status: supported
    motivation: "H28's generic velocity-field anchor removed 93-98% of BC drift but also 54-66% of surrogate gain; protecting only the benchmark-relevant endpoint may avoid irrelevant constraints."
    parent: H28
    priority: high
  - id: H30
    statement: "Training-time zero-endpoint conflict projection improves full-Gaussian Can success without materially degrading zero-source success."
    status: invalidated
    motivation: "H29 passed both fixed-batch mechanism gates while retaining over 72% of surrogate progress and removing over 66% of deterministic endpoint drift."
    parent: H29
    priority: high
  - id: H31
    statement: "A marginal-preserving AR(1) Gaussian flow source improves random-source Can success by reducing action-chunk boundary jitter without source distribution shift."
    status: refuted
    motivation: "Independent Gaussian sources change abruptly at every replan; temporal correlation preserves the exact N(0,I) marginal unlike the failed previous-action prior, while making neighboring action chunks more coherent."
    parent: null
    priority: high
  - id: H32
    statement: "Projecting only the negative-advantage FPO++ gradient when it conflicts with the positive-advantage gradient improves alignment to observed Monte Carlo outcomes without discarding negative on-policy information."
    status: refuted
    motivation: "FPO++ uses positive and negative advantages to move CFM losses in opposite directions; sparse-reward minibatches may let the abundant negative branch cancel useful positive updates. Sign-conflict projection preserves both branches except for their directly opposing component and requires no loss coefficient."
    parent: H2
    priority: high
  - id: H33
    statement: "Clipping FPO++ ratios independently across action-chunk timesteps preserves the initially useful policy-gradient direction better than clipping one ratio formed from the summed chunk loss."
    status: refuted
    motivation: "The paper extends clipping from per-action to per-CFM-sample, but manipulation still sums 16 timestep losses before clipping. A single shifted timestep can therefore suppress the entire chunk update; temporal per-sample clipping can localize that trust-region decision while preserving the on-policy gradient scale."
    parent: H2
    priority: high
  - id: H34
    statement: "Coordinate-wise median aggregation of initial FPO++ microbatch gradients improves alignment to observed terminal outcomes relative to ordinary mean accumulation."
    status: refuted
    motivation: "H24 shows that summing minibatch gradients does not remove update drift, but a mean retains outlier components. A coefficient-free coordinate median can suppress microbatch-specific gradient outliers at the first update without changing rewards, advantages, sources, or CFM samples."
    parent: H24
    priority: high
  - id: H35
    statement: "Filtering terminal-labeled FPO++ chunks whose normalized GAE sign contradicts their observed discounted terminal outcome improves the first actor-gradient direction."
    status: refuted
    motivation: "H21-H22 show that official GAE ordering and magnitudes are useful but imperfect, while H15 shows success-only selection is biased. A coefficient-free sign-consistency filter retains both successes and failures and removes only contributions contradicted by their own observed terminal outcome."
    parent: H21
    priority: high
  - id: H30b
    statement: "The completed zero-endpoint PCGrad candidate improves balanced full-Gaussian Can success over its matched control without materially degrading zero-source success."
    status: refuted
    motivation: "H29 passed its mechanism audit and H30 training was valid, but the original reward screen was censored by requesting fewer episodes than asynchronous environments. Existing frozen checkpoints can be compared without retraining using one episode from every environment."
    parent: H30
    priority: high
  - id: H36
    statement: "Replacing FPO++ flat clipping with paper-default PPO-RB rollback preserves the pre-update held-out gradient direction across ten actor epochs without sacrificing most surrogate progress."
    status: refuted
    motivation: "H18 isolates severe repeated-epoch ratio drift and gradient rotation, while H23-H24 show that smaller steps and full-batch accumulation do not fix it. Rollback adds inward pressure exactly when improving CFM ratios cross the existing bound while preserving the on-policy gradient."
    parent: H18
    priority: high
  - id: H37
    statement: "Geometric median-of-means aggregation improves the initial FPO++ gradient's alignment to observed terminal outcomes while preserving complete-vector structure."
    status: refuted
    motivation: "H34's coordinate median damaged outcome alignment despite preserving scale, implicating broken cross-coordinate structure rather than the absence of heavy-tailed microbatch gradients. GMOM robustly aggregates whole gradient vectors and is supported by prior PPO evidence."
    parent: H34
    priority: high
  - id: H38
    statement: "Five explicit-midpoint flow steps reduce Can action-endpoint integration error relative to ten Euler steps at the same ten network evaluations, without reducing source-conditioned diversity."
    status: supported
    motivation: "Conditional reflow established that endpoint discretization error is measurable, while recent update-path and robust-gradient interventions failed. A second-order solver is a distinct inference-only route that can improve endpoint fidelity without training or extra NFE."
    parent: H1
    priority: high
  - id: H38b
    statement: "Equal-NFE midpoint-5 improves balanced Can success over official Euler-10 without materially degrading either zero- or Gaussian-source behavior."
    status: refuted
    motivation: "H38 reduced source-matched Euler-64 endpoint error by more than 98% under both source regimes at unchanged measured NFE and diversity; closed-loop reward transfer is the remaining question."
    parent: H38
    priority: high
  - id: H39
    statement: "The released FPO++ x1-prediction KL-adaptive learning-rate controller preserves held-out Can policy-gradient direction through ten actor epochs without sacrificing most surrogate progress."
    status: refuted
    motivation: "H18 observes destructive within-update gradient rotation and H23 shows that a fixed lower LR loses progress without preserving direction; Appendix D.2 and the released motion-tracking implementation provide a measured-divergence controller that changes LR only when policy movement leaves a target band."
    parent: H18
    priority: high
  - id: H40
    statement: "The released Square base checkpoint provides a non-saturated balanced reward regime suitable for short paired FPO++ method screens."
    status: supported
    motivation: "Can step 1000 is reward-starved for short training while step 6000 screens can saturate; the paper reports roughly 28.6% Square base success and meaningful FPO++ gains, and the released checkpoint is already available on the server."
    parent: H0
    priority: high
  - id: H41
    statement: "Zero-endpoint PCGrad improves short-horizon Square FPO++ random-source success without materially degrading zero-source behavior."
    status: refuted
    motivation: "H29 passed its Can mechanism audit and H30b produced small same-direction gains but was underpowered by a saturated control; H40 establishes non-saturated Square headroom in both source modes."
    parent: H29
    priority: high
  - id: H42
    statement: "Restoring a short-finetuned Square checkpoint from 16 to its pretrained 8-action execution horizon improves random-source success without degrading zero-source behavior."
    status: refuted
    motivation: "H41 exposed a task-specific execution mismatch: the released Square checkpoint defaults to 8 actions while the official FPO++ command evaluates 16; restoring the native horizon directly increases visual feedback and is testable without training."
    parent: H40
    priority: high
  - id: H43
    statement: "Resetting actor AdamW moments at each new Square rollout prevents stale cross-rollout statistics from distorting FPO++ updates and improves random-source success without degrading zero-source behavior."
    status: refuted
    motivation: "The released loop carries Adam moments across independently collected on-policy rollouts; prior optimizer tests changed within-rollout update behavior but did not isolate this nonstationary boundary."
    parent: H40
    priority: high
  - id: H44
    statement: "Uniform averaging of all actor-update checkpoints from one short Square FPO++ trajectory improves random-source success without degrading zero-source behavior."
    status: refuted
    motivation: "SWA can smooth one optimization trajectory without source-specific inference or checkpoint selection; H25 tested only a BC-to-final midpoint rather than within-trajectory averaging."
    parent: H40
    priority: high
  - id: H45
    statement: "Advantage-sign-stratified actor minibatches improve Gaussian-source Square success by stabilizing sequential minibatch composition without reweighting samples."
    status: refuted
    motivation: "The official loop combines random chunk shuffling, minibatch-local advantage normalization, and eight sequential Adam steps; H32 shows both advantage signs carry mostly non-conflicting information, so composition should be stabilized rather than projected away."
    parent: H40
    priority: high
  - id: H46
    statement: "Selecting the lower-curvature of two same-observation Gaussian Square action chunks improves random-source success without changing the checkpoint or zero-source behavior."
    status: refuted
    motivation: "Global sampler and trajectory smoothing repeatedly trade zero and Gaussian modes; within-observation ODE straightness offers a coefficient-free policy-confidence signal that can rank stochastic candidates while leaving zero inference untouched."
    parent: H40
    priority: high
  - id: H47
    statement: "Collecting complete 400-step Square rollouts improves FPO++ success by replacing critic-bootstrap censoring of initial failures with observed terminal outcomes."
    status: refuted
    motivation: "The released 320-step Square rollout ends before the 400-step task horizon, so unsuccessful initial episodes are bootstrapped while successful episodes receive terminal labels."
    parent: H40
    priority: high
  - id: H48
    statement: "A frozen Square flow actor jointly modulated by a PPO-trained source-latent policy and bounded residual-action policy improves pooled deterministic/stochastic success."
    status: refuted
    motivation: "RFS separates global latent exploration and local output correction while preserving the pretrained flow field and using an exact explicit-policy PPO ratio."
    parent: H40
    priority: high
  - id: H49
    statement: "Temporally factorizing RFS's explicit PPO ratio preserves its on-policy gradient while reducing the high joint-ratio clipping enough to improve Square reward."
    status: refuted
    motivation: "H48 clipped 72.6-76.0% of 224-dimensional joint ratios; unlike H33's inactive FPO premise, RFS has a measured clipping bottleneck at the exact explicit-policy likelihood."
    parent: H48
    priority: high
  - id: H50
    statement: "A simulator-state Square critic ranks complete-episode discounted success more accurately than the official critic trained on frozen visual conditioning."
    status: refuted
    motivation: "H19 showed that target calibration alone does not fix critic ranking, while RLDT and other value-guided methods require a trustworthy critic before policy transport."
    parent: H40
    priority: high
  - id: H51
    statement: "Potential-based RoboSuite stage shaping improves Gaussian-source Square success without degrading zero-source behavior."
    status: refuted
    motivation: "H50 rules out a cheap privileged critic, while the released wrapper discards bounded reach, grasp, lift, and hover progress that can be converted into policy-invariant local credit."
    parent: H40
    priority: high
  - id: H52
    statement: "Output-head-only FPO++ preserves useful Square surrogate progress while reducing full-model gradient rotation and endpoint drift."
    status: refuted
    motivation: "The final velocity head is only about 0.88% of the non-visual Square actor; surgical adaptation may avoid distorting pretrained flow features under scarce sparse-reward updates."
    parent: H40
    priority: high
  - id: H53
    statement: "Mirrored complete-episode success differences are reproducible across seed blocks in a fixed 16-direction Square actor parameter subspace."
    status: refuted
    motivation: "H0-H52 repeatedly fail inside the critic/GAE/implicit-ratio chain; direct episodic parameter search removes value estimation, temporal credit assignment, and flow-density surrogates."
    parent: H40
    priority: high
  - id: H54
    statement: "A fixed ACT-inspired ensemble of the previous unused continuation and current visual prefix reduces chunk-boundary discontinuity and improves released Can step-1000 deterministic success."
    status: refuted
    motivation: "The policy predicts 16 actions but discards the last eight at each official eight-step replan; overlapping predictions provide a feedback-preserving smoothing mechanism without more policy calls."
    parent: null
    priority: high
  - id: H55
    statement: "Can success varies across common-seed first-chunk phase shifts enough to provide oracle headroom for a learned adaptive continuation policy."
    status: refuted
    motivation: "H27 rejects globally shorter execution and H54 rejects fixed overlap averaging, but neither tests whether the official eight-step boundaries miss precision-critical task stages."
    parent: null
    priority: high
  - id: H56
    statement: "Projecting only the released Can policy's gripper action onto {-1, +1} improves deterministic success while preserving arm actions exactly."
    status: refuted
    motivation: "The checkpoint's gripper statistics reflect a two-state controller, but continuous flow endpoints are executed directly; this isolates contact semantics from the globally harmful action smoothing tested in H31."
    parent: null
    priority: high
  - id: H57
    statement: "Keeping a unit-Gaussian arm source while zeroing only the gripper latent improves released Can step-1000 random-source success."
    status: refuted
    motivation: "H8-H10 changed complete source trajectories and H56 changed only executed outputs; neither tests whether gripper latent noise contaminates the coupled flow while preserving arm exploration."
    parent: null
    priority: high
  - id: H58
    statement: "Substituting the zero-source gripper output into an otherwise unchanged Gaussian-source arm chunk improves released Can random-source success."
    status: refuted
    motivation: "H57's two no-loss rescues do not reveal whether zero gripper latent helped through the gripper decision or coupled arm changes; output-coordinate substitution isolates that mechanism exactly."
    parent: null
    priority: high
  - id: H59
    statement: "An exact AdamW extragradient correction improves the first FPO++ actor update's outcome alignment without collapsing surrogate progress."
    status: refuted
    motivation: "The initial GAE gradient is informative, but held-out direction rotates after actor optimization; lower LR and full-batch accumulation did not correct this curvature-induced path error."
    parent: H2
    priority: high
  - id: H60
    statement: "At equal 64 velocity-network evaluations, midpoint integration improves the reproduced final Go2 checkpoint's zero- and random-source returns over official Euler integration."
    status: refuted
    motivation: "Rectified-flow geometry and equal-NFE midpoint accuracy are supported, but their Can reward tests were confounded by sparse binary reward and a zero/random tradeoff; Go2 provides dense reward and needs no MuJoCo EGL renderer."
    parent: H1
    priority: high
  - id: H61
    statement: "ReFPO's unweighted current-CFM regularizer reduces fixed-batch FPO++ ratio drift while retaining useful surrogate progress and outcome-gradient direction."
    status: refuted
    motivation: "A subsequent paper specifies a direct fixed-batch regularizer distinct from H2's failed offline-reflow gradient-disagreement mechanism; it can be falsified in one paired actor-update audit without a long training run."
    parent: H2
    priority: high
  - id: H62
    statement: "Replay-exact Square vine rollouts yield reproducible local action-chunk return rankings across independent continuation-noise blocks."
    status: refuted
    motivation: "Existing critic and trajectory-level estimators are unreliable; common-state branch returns may isolate local sparse-reward action credit without learning a Q function."
    parent: H2
    priority: high
  - id: H63
    statement: "Complete Square trajectory groups from a shared simulator initialization yield dense leave-one-out terminal-success advantages for critic-free FPO++ weighting."
    status: refuted
    motivation: "H62's intermediate binary suffix outcomes were mostly tied, while Square's roughly 35% full-trajectory random success predicts mixed outcomes in about 80% of four-replica common-scene groups."
    parent: H40
    priority: high
  - id: H64
    statement: "A same-scene frozen zero-source return yields denser behavior-preserving episodic advantages for Gaussian Square trajectories than an exact group-relative baseline."
    status: refuted
    motivation: "H63 proves scene difficulty matters but discards homogeneous Gaussian groups; a deterministic reference rewards stochastic rescues and penalizes stochastic regressions without depending on the sampled Gaussian action."
    parent: H63
    priority: high
  - id: H65
    statement: "Uniformly averaging the final five EMA actors from the reproduced official Go2 FPO++ run improves paired zero/random dense return over the final checkpoint."
    status: refuted
    motivation: "The best zero checkpoint is iteration 1450 while the best random checkpoint is 1499, and the fixed late window occupies a tight parameter neighborhood; averaging may reduce late optimizer-path variance without training or extra inference cost."
    parent: H0
    priority: high
  - id: H66
    statement: "Averaging matched z/-z flow endpoints reduces the reproduced final Go2 actor's random-source return deficit while preserving its zero-source action exactly."
    status: supported
    motivation: "The final actor has a repeatable roughly one-point zero/random return gap, while H26's pooled antithetic Can result exactly tied zero behavior; dense paired Go2 return can test whether symmetric transport reliably recovers central-policy performance."
    parent: H26
    priority: high
  - id: H67
    statement: "Exact antithetic source pairing improves Go2 return over an IID two-source endpoint average at the same 128 NFE/action."
    status: supported
    motivation: "H66 must be separated from generic test-time averaging and compared with the stronger zero-source deployment policy before it can support a paper claim."
    parent: H66
    priority: high
  - id: H68
    statement: "The equal-compute antithetic-over-IID return gain remains positive at iterations 500 and 1000 of the official Go2 seed-42 training trajectory."
    status: supported
    motivation: "A publication claim should not rest on a source-cancellation property found only in the final checkpoint; cheap stage generalization precedes independent training seeds."
    parent: H67
    priority: high
  - id: H69
    statement: "Antithetic source pairing beats an equal-NFE IID endpoint pair across three independently trained official Go2 policies."
    status: active
    motivation: "Same-trajectory checkpoint consistency cannot establish model-seed generality; three fixed final checkpoints provide the minimum publication-stage independent confirmation."
    parent: H67
    priority: high
  - id: H70
    statement: "Two Euler-32 antithetic endpoints improve Go2 return over one Euler-64 random endpoint at the same total 64 NFE/action."
    status: supported
    motivation: "The closest antithetic-noise literature weakens pairing novelty and H66 doubles compute; preserving the control gain at equal total NFE would create a stronger efficiency contribution."
    parent: H67
    priority: high
  - id: H71
    statement: "Batching the two Euler-32 antithetic endpoint solves reduces policy latency by at least 15% versus sequential execution and stays within 1.25x of one Euler-64 random solve."
    status: supported
    motivation: "H70 establishes equal NFE, but the current helper launches its two endpoint solves sequentially; a publication-level efficiency claim should include measured policy latency."
    parent: H70
    priority: high

