name: FPO
multi_proc: True
params:
  gamma: 0.95
  gae_lambda: 0.95
  learning_rate: 1e-5
  vf_coef: 0.5
  clip_range: 0.2
  n_steps: 4096
  batch_size: 256
  n_epochs: 5
  max_grad_norm: 1.0
  actor_max_grad_norm: 1.0
  critic_max_grad_norm: 1.0
  flow_actor_lr_scale: 1.0
  residual_head_lr_scale: 1.0
  direct_head_lr_scale: 1.0
  gaussian_log_std_lr_scale: 1.0
  residual_head_max_grad_norm: 1.0
  direct_head_max_grad_norm: 1.0
  normalize_advantage: True
  use_clipped_value_loss: False

  # Flow policy.
  actor_hidden_dims: [256, 128]
  critic_hidden_dims: [256, 128]
  activation: tanh
  timestep_embed_dim: 16
  sampling_steps: 8
  actor_mlp_output_scale: 1.0
  actor_scale: 1.0
  action_clip: 1.0
  action_perturb_std: 0.0

  # Conditional flow matching loss used as the PPO ratio proxy.
  n_samples_per_action: 16
  cfm_loss_t_inverse_cdf_beta: 1.5
  cfm_loss_reduction: mean
  cfm_loss_use_huber: True
  cfm_loss_huber_delta: 1.0
  cfm_loss_huber_style: torch
  flow_network_output_param: u
  cfm_loss_mode: u
  action_head_mode: flow_residual
  residual_head_hidden_dims: [128, 64]
  residual_action_scale: 0.1
  residual_head_zero_init: True
  direct_head_hidden_dims: [256, 128]
  direct_action_scale: 1.0
  direct_head_zero_init: False
  cfm_diff_clip: 5.0
  cfm_diff_clip_min: null
  cfm_diff_clip_max: null
  cfm_loss_clamp: 20.0
  cfm_loss_clamp_negative_advantages: null
  log_ratio_scale: 1.0
  trust_region_mode: ppo
  actor_objective: fpo
  fpo_objective_coef: 1.0
  fpo_objective_min_coef: 1.0
  fpo_objective_decay_steps: 0
  gaussian_objective_coef: 1.0
  gaussian_objective_min_coef: 1.0
  gaussian_objective_decay_steps: 0
  eval_deterministic: False
  resume_load_optimizer: True
  gaussian_action_std: 0.05
  gaussian_logprob_action: raw
  # policy: RFPO's own Normal wrapper; ppo_base_raw: unclipped base mean;
  # ppo_base_native: directly use SB3 PPO forward/evaluate_actions for sanity checks.
  gaussian_mean_source: policy
  gaussian_action_std_source: fixed
  gaussian_action_std_scale: 1.0
  gaussian_action_std_min_scale: 0.0
  gaussian_action_std_decay_steps: 0
  gaussian_action_std_trainable: False
  ent_coef: 0.0
  spo_clip_coef: 0.01
  fpo_chunk_steps: 1
  average_cfm_loss_in_chunk: False
  average_cfm_loss_over_samples: False
  rollout_deterministic: False
  rollout_action_noise_std: 0.0
  positive_advantage_only: False
  advantage_clamp_positive: null
  advantage_clamp_negative: null
  train_actor_after_iterations: 0

  # Optional checkpoint produced by tools/pretrain_fpo_bc.py.
  bc_checkpoint: null
  # Optional online BC anchor for stabilizing RFPO fine-tuning.
  bc_anchor_dataset: null
  bc_anchor_coef: 0.0
  bc_anchor_min_coef: 0.0
  bc_anchor_decay_steps: 0
  bc_anchor_batch_size: 256
  action_anchor_coef: 0.0
  action_anchor_min_coef: 0.0
  action_anchor_decay_steps: 0
  action_anchor_batch_size: 256
  action_anchor_loss: huber
  action_anchor_huber_delta: 0.05
  action_anchor_deterministic: True
  on_policy_action_anchor_coef: 0.0
  on_policy_action_anchor_min_coef: 0.0
  on_policy_action_anchor_decay_steps: 0
  # Training-only shaping for late stage object placement precision. Evaluation
  # still uses the environment reward, so this is only an optimization aid.
  obj_precision_reward_coef: 0.0
  obj_precision_reward_target: 0.001
  obj_precision_reward_scale: 250.0
  obj_precision_reward_stage_min: 2.0
  obj_precision_reward_max: 1.0
  obj_precision_penalty_coef: 0.0
  obj_precision_penalty_target: 0.001
  obj_precision_penalty_power: 1.0
  obj_precision_penalty_max: 1.0
  obj_precision_delta_coef: 0.0
  obj_precision_delta_target: 0.0011
  obj_precision_delta_max: 1.0
  ppo_base_checkpoint: null
  flow_residual_coef: 1.0
  trainable_ppo_base_actor: False
  trainable_ppo_base_critic: False
  ppo_base_actor_lr_scale: 0.25
  ppo_base_critic_lr_scale: 0.0
  value_source: fpo
  ppo_teacher_checkpoint: null
  ppo_teacher_action_anchor_coef: 0.0
  ppo_teacher_action_anchor_min_coef: 0.0
  ppo_teacher_action_anchor_decay_steps: 0
  ppo_teacher_action_anchor_deterministic: True
  advantage_weighted_action_coef: 0.0
  advantage_weighted_action_temp: 1.0
  advantage_weighted_action_max_weight: 20.0
  advantage_weighted_action_positive_only: True
  advantage_weighted_action_mode: action
  precision_elite_action_coef: 0.0
  precision_elite_err_threshold: 0.003
  precision_elite_stage_min: 2.0
  precision_elite_temp: 0.001
  precision_elite_max_weight: 10.0
  precision_elite_top_fraction: 1.0
  precision_elite_min_fraction: 0.0
  precision_elite_reward_quantile: 0.0
  precision_elite_hand_threshold: null
  precision_elite_control_threshold: null
  # action: deterministic action regression; flow: CFM on elite actions;
  # gaussian_nll: actor-level negative log probability of elite actions.
  precision_elite_mode: action

  # Conservative RFPO safety controls. These keep the best evaluated checkpoint
  # because long online fine-tuning can drift away from the BC policy.
  best_metric: eval/mean_reward
  best_metric_mode: max
  rfpo_precision_score_stage_min: 2.0
  rfpo_precision_score_pregrasp_min: 0.98
  rfpo_precision_score_obj_err_target: 0.0011
  rfpo_precision_score_obj_err_coef: 500.0
  rfpo_precision_score_obj_err_cap: 2.0
  save_best_model: True
  rollback_to_best_on_degrade: False
  rollback_patience: 0
  reset_optimizer_on_rollback: True
  early_stop_on_degrade: False
  early_stop_patience: 0
  degrade_metric: eval/mean_reward
  degrade_threshold: 0.0
  target_kl: null
  max_clip_fraction: null
  lr_schedule: fixed
  desired_x1_kl: 0.01
  min_learning_rate: 1e-7
  max_learning_rate: 1e-5

  # Keep ViViDex PPO curriculum semantics: only pregrasp success gates stage.
  initial_curriculum_stage: 0
  curriculum_pregrasp_threshold: 0.95
  curriculum_stage1_metric: null
  curriculum_stage1_threshold: 0.0
  curriculum_stage2_metric: null
  curriculum_stage2_threshold: 0.0
  phase_schedule: []
